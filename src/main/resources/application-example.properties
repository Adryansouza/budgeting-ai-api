spring.application.name=budgeting

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:1.5b}
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-predict=80

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Windows: .venv/Scripts/python.exe
# Linux/macOS: .venv/bin/python
app.audio.python-executable=${PYTHON_EXECUTABLE:.venv/Scripts/python.exe}
app.audio.transcription-script=scripts/transcribe.py
app.audio.speech-script=scripts/speak.py
